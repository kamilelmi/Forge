<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0c">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Full-body strength program, workout tracker, Norwegian 4x4 and Zone 2 timers. Works offline.">
<title>Forge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/*
VOICE   calm, focused, a training log you trust between sets
IDEA    a coach's clipboard: one clear next step, numbers big, everything else quiet
PICTURE the illustrations and the live timers are the only visuals
COLOUR  paper white / near-black, one ember-orange accent for "do this now"
TYPE    system UI (offline), tabular numbers for weights, reps and clocks
LAYOUT  bottom tabs on the phone, side rail on the laptop; workout and timers take the full screen
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f1,#0d0d0c);--card:light-dark(#ffffff,#181817);--card2:light-dark(#f0efeb,#222220);
--ink:light-dark(#151514,#efefea);--mute:light-dark(#6b6a64,#9e9d96);--line:light-dark(#e4e3dd,#2c2b28);
--acc:light-dark(#e2521a,#ff7a3d);--acc-soft:light-dark(#fde8dd,#3b2013);--on-acc:#fff;
--good:light-dark(#178a4c,#4cc38a);--bad:light-dark(#c63636,#ff7d7d);--hard:light-dark(#d4321c,#ff6a4d);--easy:light-dark(#11876a,#3fc7a0);
--r:18px;--nav:68px}
:root[data-theme=light]{color-scheme:only light}:root[data-theme=dark]{color-scheme:only dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.15}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.grow{flex:1}

/* shell */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mute);font-size:12px;font-weight:600;min-height:52px;padding:4px 0}
.nav .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.nav button.on{color:var(--ink)}.nav button.on .ic{background:var(--acc-soft);color:var(--acc)}
.brand{display:none}
main{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(var(--nav) + 40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:10px 0 18px}
.top h1{flex:1;font-size:clamp(26px,6vw,34px);letter-spacing:-.015em}
.top h1 .sub{display:block;font-size:14px;font-weight:600;color:var(--mute);letter-spacing:0;margin-bottom:4px}
body.full .nav{display:none}
body.full main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
@media(min-width:760px){
 .nav{inset:0 auto 0 0;width:96px;flex-direction:column;gap:4px;padding:18px 8px;border-top:0;border-right:1px solid var(--line)}
 .nav button{flex:none;min-height:64px}
 .brand{display:grid;place-items:center;margin:0 auto 14px}.brand img{width:40px;height:40px;border-radius:11px}
 main{padding:24px 36px 48px calc(96px + 36px)}
 body.full main{padding-left:36px}
}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:14px;align-content:start}
.cols{display:grid;gap:14px}
@media(min-width:880px){.cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:650;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}
.btn.big{min-height:54px;font-size:17px;border-radius:14px;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{width:18px;height:18px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--mute);flex:none}
.ibtn:hover{background:var(--card2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mute)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
input[type=text],input[type=number],input[type=search],select,textarea{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end;margin-top:16px}
.empty{color:var(--mute);padding:8px 0}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--card2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .thumb,:root:not([data-theme=light]) .demo img{filter:brightness(.9)}}
:root[data-theme=dark] .thumb,:root[data-theme=dark] .demo img{filter:brightness(.9)}

/* today */
.hero{display:grid;gap:14px}
.hero .when{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.01em}
.hero h2{font-size:26px;letter-spacing:-.01em}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.strip img{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;background:var(--card2)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wk{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute)}
.wk b{font-size:13px;color:var(--ink)}
.wk.td{border:2px solid var(--acc)}
.wk.dn{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}.wk.dn b{color:var(--on-acc)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.note{border-radius:14px;padding:12px 14px;background:var(--acc-soft);color:var(--ink);font-size:14px}

/* program */
.exrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 4px;border:0;background:none;text-align:left;border-radius:12px}
.exrow:hover{background:var(--card2)}
.exline{display:flex;align-items:center;gap:2px}.exline .exrow{flex:1}
.exrow .t b .tag{vertical-align:2px;margin-left:4px}
.exrow .t{flex:1}.exrow .t b{display:block;font-size:15px}.exrow .t span{font-size:13px;color:var(--mute)}
.ssbox{border-left:3px solid var(--acc);padding-left:8px;margin:12px 0}
.sslabel{font-size:12px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin:0 0 2px 4px}
.sshow{font-size:13px;color:var(--mute);margin:0 0 4px 4px}
.sstag{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:8px;background:var(--acc);color:var(--on-acc);font-size:13px;font-weight:800;flex:none;vertical-align:2px}
.prin{display:grid;gap:10px}
.prin div{display:flex;gap:12px}.prin b{font-size:15px}.prin p{font-size:14px;color:var(--mute)}
.prin i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}

/* workout */
.whead{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 0 10px;margin:-10px 0 10px;background:var(--bg)}
.whead h1{font-size:20px;flex:1}.whead .clock{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600;font-size:14px;display:block}
.excard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.excard.alldone{opacity:.75}
.exhead{display:flex;gap:12px;align-items:center}
.exhead .nm{flex:1;text-align:left;background:none;border:0;padding:0}
.exhead .nm b{display:block;font-size:16px;line-height:1.25}.exhead .nm span{font-size:13px;color:var(--mute)}
.exhead .nm .sstag{color:var(--on-acc);font-size:13px}
.sug{margin:10px 0 4px;font-size:14px;font-weight:600;color:var(--acc)}
.sug small{display:block;color:var(--mute);font-weight:500}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:4px}
.sets th{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td.lbl{width:38px;font-weight:800;font-size:13px;color:var(--mute)}
.sets td.lbl.T{color:var(--acc)}
.sets td.prev{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;width:68px}
.sets input{width:100%;max-width:84px;min-height:42px;padding:6px 4px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}
.sets input::placeholder{color:color-mix(in srgb,var(--mute) 70%,transparent);font-weight:500}
.tk{width:44px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;margin:auto}
.tk svg{width:20px;height:20px;stroke-width:3;opacity:.35}
tr.done .tk{background:var(--good);border-color:var(--good);color:#fff}tr.done .tk svg{opacity:1}
tr.done input{background:color-mix(in srgb,var(--good) 12%,var(--card2))}
tr.W td.lbl{font-weight:700}
.addset{margin-top:6px}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg)}
.restbar .t{flex:1;font-size:13px;font-weight:600;opacity:.8}.restbar .t b{display:block;font-size:30px;line-height:1;opacity:1;font-variant-numeric:tabular-nums;color:var(--bg)}
.restbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:40px;padding:0 12px}
.restbar.go{background:var(--good);color:#fff}.restbar.go .t b{color:#fff}
.restbar .prog{position:absolute;left:0;top:0;height:3px;background:var(--acc)}

/* guide */
.demo{position:relative;aspect-ratio:1;width:100%;max-width:380px;margin:0 auto;border-radius:18px;overflow:hidden;background:#dfeefb}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s ease}
.demo .ph{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:800;background:rgb(0 0 0/.55);color:#fff;padding:3px 9px;border-radius:999px}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-top:4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video button{position:absolute;inset:0;border:0;padding:0;background:#000 center/cover no-repeat;display:grid;place-items:center}
.video button span{width:64px;height:44px;border-radius:12px;background:#e62117;display:grid;place-items:center}
.video button svg{fill:#fff;stroke:none;width:24px;height:24px}
.gsec{margin-top:18px}.gsec h3{margin-bottom:8px}
.gsec ol,.gsec ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}

/* cardio run */
.run{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:4px}
.run .phase{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.run.hard .phase{color:var(--hard)}.run.easy .phase{color:var(--easy)}
.ring{position:relative;width:min(80vw,330px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--card2);stroke-width:12}
.ring .prg{fill:none;stroke:var(--easy);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.run.hard .ring .prg{stroke:var(--hard)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;gap:6px}
.ring .big{font-size:clamp(58px,17vw,84px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.hr{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.dots i.d{background:var(--hard);border-color:var(--hard)}.dots i.c{border-color:var(--hard)}
.ctl{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:6px}
.go{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;border:0;background:var(--acc);color:#fff}
.go svg{width:32px;height:32px;stroke-width:2.5}.go svg.f{fill:currentColor;stroke:none}
.ctl .ibtn{width:54px;height:54px;border-radius:50%;background:var(--card2)}

/* history & charts */
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.hrow:last-child{border-bottom:0}
.hrow .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none;font-weight:800;font-size:14px}
.hrow .ico.l{background:var(--acc-soft);color:var(--acc)}
.hrow .t{flex:1}.hrow .t b{display:block;font-size:15px}.hrow .t span{font-size:13px;color:var(--mute)}
.chart{width:100%;height:150px;display:block}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--acc)}.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mute);font-size:11px}
.dl{display:grid;gap:4px;font-size:14px;margin-top:8px}
.dl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}

/* dialogs & toast */
dialog{border:0;border-radius:22px;background:var(--card);color:var(--ink);padding:22px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgb(0 0 0/.5)}
dialog h2{font-size:22px;margin-bottom:14px}
dialog.wide{width:min(720px,calc(100vw - 24px))}
@media(max-width:600px){dialog,dialog.wide{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:calc(100dvh - 24px)}}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{display:grid;place-items:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:14px;cursor:pointer;color:var(--ink);text-align:center;padding:0 4px}
.seg input:checked+b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+b{outline:2px solid var(--acc);outline-offset:2px}
.tog{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:500;color:var(--ink)}
.tog input{width:20px;height:20px;accent-color:var(--acc)}
.dsec{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;width:max-content;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:32px}
body.full #toast{bottom:calc(100px + env(safe-area-inset-bottom))}
@media(min-width:760px){#toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main><div class="wrap">
 <header class="top"><h1 id="title">Today</h1><button class="ibtn" data-a="settings" aria-label="Settings" id="gear"></button></header>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

<script>const EXD={"squat":{"n":"Back Squat","img":"squat","ph":["start","peak"],"k":"bb","inc":5,"st":2.5,"pl":"bar","m1":["Gluteus maximus","Quadriceps"],"m2":["Erector spinae","Hamstrings"],"how":["Position the bar on your upper traps.","Unrack and step back, feet shoulder-width apart.","Brace your core and squat down until thighs are parallel.","Drive through your heels to stand back up.","Repeat."],"tips":["Keep your chest up throughout the movement.","Push your knees out in line with your toes."],"d":"A compound lower-body movement targeting the quadriceps, glutes, and hamstrings."},"bench":{"n":"Bench Press","img":"bench-press","ph":["start","peak"],"k":"bb","inc":2.5,"st":2.5,"pl":"bar","m1":["Pectoralis major"],"m2":["Anterior deltoid","Triceps brachii"],"how":["Lie flat on a bench with your eyes under the bar.","Grip the bar slightly wider than shoulder-width.","Unrack the bar and lower it to your mid-chest.","Press the bar back up to full arm extension.","Repeat for the desired number of reps."],"tips":["Keep your feet flat on the floor.","Maintain a slight arch in your lower back.","Drive through your legs for stability."],"d":"A compound pushing movement that targets the chest, shoulders, and triceps."},"csrow":{"n":"Chest-Supported DB Row","img":"chest-supported-db-row","ph":["start","peak"],"k":"db","inc":2,"st":1,"pl":null,"m1":["Latissimus dorsi","Rhomboids"],"m2":["Biceps brachii","Posterior deltoid"],"how":["Lie face-down on an incline bench with dumbbells hanging beneath.","Row the dumbbells up to your sides.","Squeeze at the top, then lower.","Repeat."],"tips":["The chest support eliminates back fatigue.","Focus on squeezing the shoulder blades together."],"d":"A dumbbell row with chest support to eliminate lower back strain and isolate the back muscles."},"machinerow":{"n":"Chest-Supported Machine Row","img":"chest-supported-machine-row","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Latissimus dorsi","Rhomboids"],"m2":["Biceps brachii","Posterior deltoid","Trapezius"],"how":["Adjust the seat so the handles sit at lower-chest height, then sit with your chest against the pad and your feet planted.","Reach forward and take the handles with your arms extended and your shoulders relaxed.","Brace your trunk, then pull the handles back by driving your elbows behind you.","Squeeze your shoulder blades together at the end of the pull without lifting your chest off the pad.","Pause briefly, then extend your arms to return the handles forward under control.","Repeat for the planned repetitions, keeping your chest on the pad throughout."],"tips":["Pull with the elbows rather than the hands, so the lats and mid-back lead and the biceps assist.","Keep the chest on the pad and the shoulders down; shrugging or leaning back turns the row into an upper trapezius pull.","Let the shoulder blades spread forward at the start of each repetition to get a full stretch before the next pull."],"d":"A seated rowing machine exercise with a chest pad that supports the torso, so the lats and the muscles between the shoulder blades do the pulling and the lower back stays out of it. You pull the handles back by driving the elbows behind you, then let them return forward with control."},"calf":{"n":"Standing Calf Raise","img":"standing-calf-raise","ph":["start","peak"],"k":"mc","inc":5,"st":2.5,"pl":null,"m1":["Gastrocnemius"],"m2":["Soleus"],"how":["Stand on the edge of a platform or calf raise machine.","Lower heels below the platform.","Push up onto your toes.","Lower slowly.","Repeat."],"tips":["Pause at the top to maximize contraction.","Full heel drop increases range of motion."],"d":"A calf raise performed standing to develop the gastrocnemius through a full range of motion."},"legcurl":{"n":"Seated Leg Curl","img":"seated-leg-curl","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Hamstrings"],"m2":["Gastrocnemius"],"how":["Adjust the seat back and ankle pad so your knees align with the machine's pivot point.","Sit upright, place the backs of your ankles on top of the pad, and grip the handles.","Curl your lower legs down and back under the seat as far as the machine allows.","Pause at peak contraction, then return the weight slowly to the starting position.","Repeat for the desired reps."],"tips":["Keep your back firmly against the backrest throughout the movement.","Point toes slightly toward your shins at peak contraction to increase hamstring activation.","Control the eccentric phase — do not let the weight pull your legs back quickly."],"d":"A machine isolation exercise for the hamstrings performed in a seated position, providing consistent tension and reduced hip flexor involvement compared to the lying variant."},"latraise":{"n":"Dumbbell Lateral Raise","img":"lateral-raise","ph":["start","peak"],"k":"db","inc":1,"st":1,"pl":null,"m1":["Lateral deltoid"],"m2":["Anterior deltoid"],"how":["Stand holding dumbbells at your sides.","Raise the dumbbells out to the sides until arms are parallel to the floor.","Lower under control.","Repeat."],"tips":["Slight bend in the elbows.","Lead with your elbows, not your hands."],"d":"An isolation movement targeting the lateral deltoid for shoulder width."},"inclinecurl":{"n":"Incline Dumbbell Curl","img":"incline-db-curl","ph":["start","peak"],"k":"db","inc":1,"st":1,"pl":null,"m1":["Biceps brachii"],"m2":["Brachialis"],"how":["Sit on an incline bench set to 45 degrees, holding dumbbells at your sides.","Let your arms hang straight down with palms forward.","Curl the dumbbells up toward your shoulders.","Lower with control to full extension.","Repeat."],"tips":["Keep your head and shoulders against the bench throughout.","Don't let your elbows drift forward as you curl.","Avoid shrugging your shoulders forward as you lift the weight."],"d":"A bicep curl on an incline bench for a deeper stretch of the long head."},"ohext":{"n":"Overhead Cable Triceps Extension","img":"cable-overhead-tricep-extension","ph":["start","peak"],"k":"cb","inc":2.5,"st":1.25,"pl":null,"m1":["Triceps brachii"],"m2":["Anterior deltoid"],"how":["Attach a rope to the low pulley and select a light weight.","Take the rope in both hands, turn away from the stack and step forward into a staggered stance so the cable pulls you back.","Raise the rope overhead with your elbows bent and your upper arms close to your ears, so your hands are behind your head.","Brace your trunk and keep your upper arms still, then straighten your elbows to push the rope up until your arms are fully extended overhead.","Pause briefly at the top, then bend your elbows to lower the rope back behind your head under control.","Repeat for the planned repetitions."],"tips":["Keep the elbows pointing forward and the upper arms still; letting them flare out or drift turns the extension into a press.","Step far enough forward that the cable holds you steady, and avoid arching your lower back as the arms go overhead.","Use a weight you can control through the full stretch; heavy loads pull the elbows apart."],"d":"A cable triceps exercise: facing away from the weight stack, you hold a rope behind your head and straighten your elbows to push it up and overhead. The overhead position stretches the long head of the triceps, and the cable keeps tension on the muscle through the whole movement."},"trapdl":{"n":"Trap Bar Deadlift","img":"hex-bar-deadlift","ph":["start","peak"],"k":"bb","inc":5,"st":2.5,"pl":"trap","m1":["Erector spinae","Gluteus maximus","Quadriceps"],"m2":["Forearm flexors","Hamstrings","Trapezius"],"how":["Stand inside a loaded trap bar with feet shoulder-width apart.","Hinge at the hips and knees to grip the handles.","Brace your core and set your back flat.","Drive through your heels and extend hips and knees to stand up.","Lock out at the top with shoulders pulled back.","Lower the bar back to the floor under control."],"tips":["Keep your chest up and back flat as you set your grip.","Push the floor away rather than yanking the bar with your back.","Stand fully upright at the top without leaning back."],"d":"A deadlift standing inside a hex (trap) bar, keeping the load centered for a more upright, back-friendly pull."},"inclinepress":{"n":"Incline Dumbbell Press","img":"incline-db-press","ph":["start","peak"],"k":"db","inc":2,"st":1,"pl":null,"m1":["Pectoralis major"],"m2":["Anterior deltoid","Triceps brachii"],"how":["Set bench to 30-degree incline and sit back with dumbbells at shoulder level.","Press dumbbells up and together until arms are fully extended.","Lower dumbbells back to shoulder level with control.","Repeat."],"tips":["Keep your wrists stacked directly over your elbows.","Press up without banging the dumbbells together at the top.","Keep your shoulder blades pulled back against the bench."],"d":"An incline pressing movement emphasizing the upper chest."},"pulldown":{"n":"Lat Pulldown","img":"lat-pulldown","ph":["start","peak"],"k":"cb","inc":2.5,"st":2.5,"pl":null,"m1":["Latissimus dorsi"],"m2":["Biceps brachii","Posterior deltoid","Rhomboids"],"how":["Sit at the lat pulldown machine with thighs secured under the pads.","Grip the wide bar with an overhand grip.","Pull the bar down to your upper chest, squeezing your lats.","Slowly return the bar to the starting position.","Repeat."],"tips":["Drive your elbows down and back rather than pulling with your hands.","Avoid leaning far back or using momentum to move the weight.","Keep your chest lifted and shoulders down away from your ears."],"d":"A cable machine exercise targeting the latissimus dorsi."},"bss":{"n":"Bulgarian Split Squat","img":"bulgarian-split-squat","ph":["start","peak"],"k":"db","inc":2,"st":1,"pl":null,"m1":["Gluteus maximus","Quadriceps"],"m2":["Hamstrings"],"how":["Stand in front of a bench, place one foot behind you on the bench.","Hold dumbbells at your sides.","Lower your body until your front thigh is parallel to the floor.","Push through your front heel to stand back up.","Repeat on both sides."],"tips":["Keep most of your weight on the front leg.","Track your front knee over your toes without letting it cave inward.","Square your hips forward and avoid rotating toward the bench."],"d":"A single-leg squat variation with the rear foot elevated."},"cablelat":{"n":"Cable Lateral Raise","img":"cable-lateral-raise","ph":["start","peak"],"k":"cb","inc":1.25,"st":1.25,"pl":null,"m1":["Lateral deltoid"],"m2":["Anterior deltoid","Trapezius"],"how":["Stand sideways to a low pulley and grip the handle with the hand farther from the machine.","Keep a soft bend in the elbow and let the cable run across the front of your body.","Raise the arm out to the side until parallel to the floor.","Lower under control. Complete reps per side, then switch.","Maintain tension — do not let the weight rest at the bottom."],"tips":["Lead with the elbow, not the hand.","Pause briefly at the top, do not swing.","Use a lighter load than for dumbbell — cable tension is constant."],"d":"A unilateral lateral raise on the cable, providing constant tension on the side delt."},"reardelt":{"n":"Reverse Pec Deck","img":"machine-reverse-fly","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Posterior deltoid"],"m2":["Rhomboids","Trapezius"],"how":["Adjust the seat so the handles are at shoulder height, then sit facing the machine with your chest against the pad.","Grip the handles with your arms reaching forward and a slight bend in the elbows.","Keep your shoulders down and away from your ears and brace your trunk.","Sweep the handles out and back in a wide arc, leading with the elbows, until your arms are roughly in line with your shoulders.","Squeeze your shoulder blades together briefly without leaning back off the pad.","Return the handles forward slowly and repeat for the planned repetitions."],"tips":["Lead with the elbows rather than pulling with the hands, so the rear deltoids do the work and not the biceps.","Keep the chest on the pad and the neck relaxed; leaning back or shrugging moves the load to the upper trapezius.","Choose a weight you can lower under control; a lighter load with a slow return works the rear deltoids better than a heavy swing."],"d":"A seated machine exercise for the rear deltoids, also known as the reverse pec deck: facing the pad, you sweep the two handles out and back in a wide arc against the weight stack. The pad keeps the torso still, so the work stays on the back of the shoulders and the muscles between the shoulder blades."},"rearfly":{"n":"Dumbbell Rear Delt Fly","img":"rear-delt-fly","ph":["start","peak"],"k":"db","inc":1,"st":1,"pl":null,"m1":["Posterior deltoid","Rhomboids"],"m2":["Trapezius"],"how":["Hold dumbbells and hinge forward at the hips.","With a slight bend in elbows, raise the dumbbells out to the sides.","Squeeze your shoulder blades at the top.","Lower with control.","Repeat."],"tips":["Choose a light weight to keep the movement strict.","Avoid using momentum from the torso to swing the weights up.","Lead with your elbows rather than your hands."],"d":"An isolation movement targeting the posterior deltoids and upper back."},"hlr":{"n":"Hanging Leg Raise","img":"hanging-leg-raise","ph":["start","peak"],"k":"nl","inc":0,"st":0,"pl":null,"m1":["Hip flexors","Rectus abdominis"],"m2":["Obliques"],"how":["Hang from a pull-up bar with an overhand grip.","Raise your legs in front of you until they are parallel to the floor.","Hold briefly, then lower with control.","Avoid swinging.","Repeat."],"tips":["Curl your pelvis up at the top to fully engage your abs.","Keep your shoulders engaged rather than hanging passively.","Bend your knees to make the movement easier if needed."],"d":"An advanced core exercise performed hanging from a bar."},"ohp":{"n":"Overhead Press","img":"ohp","ph":["start","peak"],"k":"bb","inc":2.5,"st":2.5,"pl":"bar","m1":["Anterior deltoid","Lateral deltoid"],"m2":["Trapezius","Triceps brachii"],"how":["Stand with feet shoulder-width apart, bar at collarbone level.","Brace your core and press the bar overhead.","Lock out at the top with the bar over your mid-foot.","Lower the bar back to collarbone height.","Repeat."],"tips":["Do not lean back excessively.","Squeeze your glutes for stability."],"d":"A compound overhead pressing movement targeting the shoulders and triceps."},"pullup":{"n":"Weighted Pull-Up","img":"weighted-pull-up","ph":["start","peak"],"k":"bw","inc":2.5,"st":1.25,"pl":null,"m1":["Latissimus dorsi"],"m2":["Biceps brachii","Posterior deltoid","Rhomboids","Trapezius"],"how":["Attach a plate to a dip belt around your waist so the weight hangs between your legs, or hold the load between your feet.","Grip the pull-up bar with an overhand grip slightly wider than shoulder-width and hang at full arm extension with your legs together.","Pull your elbows down and back to drive your chest toward the bar until your chin clears it.","Lower yourself under control back to the full dead hang, keeping tension on your lats and letting the weight settle before the next rep.","Repeat for the desired number of reps."],"tips":["Add weight only once you can do clean bodyweight pull-ups through a full range — small jumps of 2.5–5 kg are enough, since the load stacks on top of your own bodyweight.","Keep your legs together and your core braced so the hanging plate does not start swinging; a swinging weight turns the rep into a kip.","Do not cut the bottom short — return to a full dead hang each rep, and stop the set when your chin stops clearing the bar rather than grinding out partials."],"d":"A pull-up performed with extra load — most often a plate hung from a dip belt between the legs — to keep the movement in a strength rep range once bodyweight pull-ups are easy."},"assistpull":{"n":"Assisted Pull-Up","img":"assisted-pull-ups","ph":["start","peak"],"k":"as","inc":2.5,"st":2.5,"pl":null,"m1":["Latissimus dorsi"],"m2":["Biceps brachii","Forearm flexors","Posterior deltoid","Rhomboids"],"how":["Place your knees on the assisted pull-up machine pad.","Grip the bar with palms facing away, slightly wider than shoulders.","Pull your chest toward the bar by driving your elbows down.","Lower yourself under control to a full hang.","Repeat for the desired number of reps."],"tips":["Pull your shoulder blades down before bending your arms.","Avoid swinging or using momentum from the knee pad.","Decrease the assistance over time to progress toward unassisted reps."],"d":"A machine-assisted pull-up reducing the effective body weight, allowing beginners to train the lats through a full range."},"rdl":{"n":"Romanian Deadlift","img":"romanian-deadlift","ph":["start","peak"],"k":"bb","inc":5,"st":2.5,"pl":"bar","m1":["Gluteus maximus","Hamstrings"],"m2":["Erector spinae"],"how":["Stand holding a barbell at hip level with an overhand grip.","Hinge at the hips, pushing them back while keeping legs nearly straight.","Lower the bar along your legs until you feel a hamstring stretch.","Drive your hips forward to return to standing.","Repeat."],"tips":["Keep your spine neutral and avoid rounding the lower back.","Maintain the same slight knee bend for the entire rep.","Go only as deep as your hamstring flexibility allows."],"d":"A hip-hinge movement emphasizing the hamstrings and glutes."},"hack":{"n":"Hack Squat","img":"hack-squat","ph":["start","peak"],"k":"mc","inc":5,"st":2.5,"pl":null,"m1":["Gluteus maximus","Quadriceps"],"m2":["Gastrocnemius","Hamstrings"],"how":["Load the hack squat machine and step on, positioning your back and shoulders against the pads.","Place your feet shoulder-width on the platform with toes turned out slightly.","Unlock the safety handles and lower the sled by bending at the knees and hips.","Descend until your thighs are at least parallel to the platform.","Drive through your heels to extend the legs and push the sled back to the start.","Re-engage the safety handles after your final rep."],"tips":["Keep your lower back pressed against the pad throughout the movement.","Placing the feet higher on the platform shifts emphasis to the glutes and hamstrings.","Control the descent; do not bounce out of the bottom position."],"d":"A compound lower-body machine exercise on the hack squat sled, targeting the quadriceps through a guided squat pattern."},"legpress":{"n":"Leg Press","img":"leg-press","ph":["start","peak"],"k":"mc","inc":5,"st":2.5,"pl":null,"m1":["Gluteus maximus","Quadriceps"],"m2":["Hamstrings"],"how":["Sit in the leg press machine with feet shoulder-width apart on the platform.","Release the safety catches and lower the platform by bending your knees.","Push the platform back up until legs are nearly straight.","Do not lock your knees at the top.","Repeat."],"tips":["Keep your lower back and hips pressed into the seat.","Lower only as far as you can without your hips tucking under.","Drive evenly through your whole foot, not just your toes."],"d":"A machine-based compound movement for the quads and glutes."},"dip":{"n":"Weighted Dip","img":"weighted-dips","ph":["start","peak"],"k":"bw","inc":2.5,"st":1.25,"pl":null,"m1":["Pectoralis major","Triceps brachii"],"m2":["Anterior deltoid"],"how":["Attach a plate to a dip belt around your waist so the weight hangs between your legs.","Grip the parallel dip bars and press yourself up to the top position with your arms locked out and your feet off the floor.","Lean your torso slightly forward and lower your body by bending your elbows until your shoulders are below them.","Press back up through your palms until your arms are locked out again, keeping the hanging plate from swinging.","Repeat for the desired number of reps."],"tips":["Add weight only once you can do clean bodyweight dips through a full range — small jumps of 2.5–5 kg are enough, since the load stacks on top of your own bodyweight.","Keep your legs together and your core braced so the plate does not start swinging; a swinging weight throws off the bottom of the rep.","Keep your shoulders pulled down away from your ears and stop the descent if you feel pinching at the front of the shoulder."],"d":"A parallel-bar dip performed with extra load — most often a plate hung from a dip belt between the legs — to keep the movement in a strength rep range once bodyweight dips are easy."},"assistdip":{"n":"Assisted Dip","img":"assisted-dips","ph":["start","peak"],"k":"as","inc":2.5,"st":2.5,"pl":null,"m1":["Pectoralis major","Triceps brachii"],"m2":["Anterior deltoid","Rhomboids"],"how":["Step onto the assisted dip machine with knees on the pad.","Grip the parallel bars and support your weight with straight arms.","Lower your body by bending your elbows until shoulders are below elbows.","Press back up to the start position.","Repeat for the desired number of reps."],"tips":["Keep your elbows tracking back rather than flaring out wide.","Stop the descent if you feel pinching in the shoulders.","Reduce the assistance gradually as pressing strength improves."],"d":"A beginner-friendly dip performed on an assisted machine that offsets body weight, training the chest and triceps."},"cablecurl":{"n":"Cable Curl","img":"cable-curl","ph":["start","peak"],"k":"cb","inc":2.5,"st":1.25,"pl":null,"m1":["Biceps brachii"],"m2":["Brachialis"],"how":["Stand facing a low cable pulley with a straight bar or EZ-bar attachment.","Grip the bar with an underhand grip, elbows at your sides.","Curl the bar up toward your shoulders.","Lower with control.","Repeat."],"tips":["Keep your elbows from drifting forward as you curl.","Straighten your arms fully at the bottom of each rep.","Avoid leaning back to help lift the weight."],"d":"A bicep curl using cable resistance for constant tension."},"crunch":{"n":"Cable Crunch","img":"cable-crunch","ph":["start","peak"],"k":"cb","inc":2.5,"st":2.5,"pl":null,"m1":["Rectus abdominis"],"m2":["Obliques","Transverse abdominis"],"how":["Kneel in front of a cable machine with a rope attachment at the top.","Hold the rope near your forehead with elbows bent.","Crunch down by flexing your spine and bringing your elbows to your thighs.","Squeeze your abs hard at the bottom.","Return to the start position and repeat."],"tips":["Avoid pulling the rope down with your arms.","Keep your hips fixed so movement comes from the spine.","Exhale fully as you crunch down."],"d":"A kneeling abdominal exercise flexing the spine against cable resistance, allowing progressive loading of the rectus abdominis."},"cablerow":{"n":"Seated Cable Row","img":"seated-cable-row","ph":["start","peak"],"k":"cb","inc":2.5,"st":2.5,"pl":null,"m1":["Latissimus dorsi","Rhomboids"],"m2":["Biceps brachii","Erector spinae","Posterior deltoid"],"how":["Sit at the cable row station and place your feet on the footrests.","Grip the handle and sit upright with a slight forward lean.","Drive your elbows back and pull the handle toward your lower abdomen.","Squeeze your shoulder blades together at the end of the pull.","Extend your arms under control back to the starting position.","Repeat for the desired number of reps."],"tips":["Keep your torso upright with minimal rocking.","Drive your elbows straight back, not out to the sides.","Squeeze your shoulder blades together at the end of the pull."],"d":"A back exercise performed on a cable row machine, pulling a handle toward the torso while seated."},"tbarrow":{"n":"T-Bar Row","img":"t-bar-row","ph":["start","peak"],"k":"bb","inc":2.5,"st":2.5,"pl":null,"m1":["Latissimus dorsi","Rhomboids"],"m2":["Biceps brachii","Erector spinae","Trapezius"],"how":["Straddle the loaded T-bar with feet shoulder-width apart.","Hinge at the hips until your torso is around 45 degrees.","Grip the handles and keep your back flat.","Pull the bar up toward your chest by driving your elbows back.","Squeeze your shoulder blades at the top.","Lower the bar under control and repeat."],"tips":["Keep your hips fixed and avoid heaving the torso upright.","Maintain a soft bend in your knees to protect the lower back.","Let the weight stretch your lats fully at the bottom."],"d":"A compound row performed straddling a loaded T-bar, building thickness in the lats and rhomboids."},"gobletsquat":{"n":"Goblet Squat","img":"goblet-squat","ph":["start","peak"],"k":"db","inc":2,"st":2,"pl":null,"m1":["Gluteus maximus","Quadriceps"],"m2":["Hamstrings"],"how":["Hold a kettlebell at chest height with both hands.","Squat down keeping the weight close to your chest.","Drive back up.","Repeat."],"tips":["The goblet position naturally encourages an upright torso.","Push knees out at the bottom."],"d":"A beginner-friendly squat with a kettlebell held at chest height for improved posture and depth."},"smithfront":{"n":"Smith Machine Front Squat","img":"smith-machine-front-squat","ph":["start","peak"],"k":"mc","inc":5,"st":2.5,"pl":null,"m1":["Gluteus maximus","Quadriceps"],"m2":["Erector spinae","Gluteus medius","Hamstrings"],"how":["Set the bar at upper-chest height and step under it so it rests across the front of your shoulders, against your collarbones.","Cross your arms over the bar or take an open front-rack grip, and drive your elbows up until your upper arms are close to parallel with the floor.","Unrack the bar and stand with your feet about shoulder-width apart and slightly forward of it.","Sit straight down, keeping your elbows high and your torso upright, until your thighs are at least parallel to the floor.","Drive through the middle of your feet to stand back up, and repeat for the desired number of repetitions."],"tips":["High elbows are the whole exercise. As soon as they drop, the bar rolls off your shoulders onto your hands and the rack position collapses.","Set the safety stops just below your deepest squat position before you unrack anything -- on a front squat the fastest way out of a failed rep is to let the bar go.","Standing slightly ahead of the bar lets you keep your torso vertical. Under a fixed path, a stance directly beneath the bar forces you to lean and pushes the bar off the front rack."],"d":"A squat on the Smith machine with the bar racked across the front of the shoulders, where the fixed path and the upright torso keep the work on the quads."},"dbbench":{"n":"Dumbbell Bench Press","img":"db-bench-press","ph":["start","peak"],"k":"db","inc":2,"st":1,"pl":null,"m1":["Pectoralis major"],"m2":["Anterior deltoid","Triceps brachii"],"how":["Lie on a flat bench holding a dumbbell in each hand at chest level.","Press the dumbbells up until your arms are fully extended.","Lower them slowly back to the start.","Repeat."],"tips":["Keep wrists neutral throughout.","Squeeze your chest at the top of the movement."],"d":"A compound chest exercise using dumbbells, allowing a greater range of motion than the barbell bench press."},"chestpress":{"n":"Machine Chest Press","img":"chest-press-machine","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Pectoralis major"],"m2":["Anterior deltoid","Triceps brachii"],"how":["Sit in the machine with your back flat against the pad.","Grip the handles at chest level.","Push the handles forward until your arms are fully extended.","Slowly return to the starting position.","Repeat."],"tips":["Adjust the seat so the handles line up with mid-chest.","Keep your shoulder blades pulled back against the pad as you press.","Press to full extension without forcefully locking your elbows."],"d":"A machine-based pressing movement for the chest, ideal for beginners."},"smithbench":{"n":"Smith Machine Bench Press","img":"smith-machine-bench-press","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Pectoralis major"],"m2":["Anterior deltoid","Triceps brachii"],"how":["Lie on a flat bench set inside a Smith machine.","Grip the bar slightly wider than shoulder-width and unrack it.","Lower the bar under control to your mid-chest.","Pause briefly without bouncing.","Press the bar back up until your arms are fully extended.","Repeat for the desired number of reps."],"tips":["Align the bench so the bar lands at mid-chest, not the neck.","Keep your shoul ol.","Repeat."],"tips":["Keep your hips pressed into the bench throughout the set.","Avoid jerking the weight up with your lower back.","Use a full range of motion without letting the stack slam down."],"d":"An isolation exercise for the hamstrings using a leg curl machine."},"platelat":{"n":"Machine Lateral Raise (one arm)","img":"single-arm-plate-loaded-lateral-raise","ph":["start","peak"],"k":"mc","inc":1.25,"st":1.25,"pl":null,"m1":["Lateral deltoid"],"m2":["Anterior deltoid","Trapezius"],"how":["Set the seat height so the pad pivot lines up with your shoulder, and load only the side you are about to work.","Sit with your back flat against the pad and place the outside of your working upper arm against its pad.","Hold the handle on the free side or rest that hand in your lap, and keep your torso square to the seat.","Push the working arm out and up against the pad until the upper arm is level with your shoulder, then lower it under control.","Complete all the repetitions on that side, then load and work the other side."],"tips":["Match the sides on the weaker arm, not the stronger one. Working one side at a time only tells you about an imbalance if you let the weaker side set the number.","Do not let the torso tip toward the working side. With load on one arm only, the machine no longer balances itself and leaning turns the raise into a side bend.","Start with the weaker arm so it sets the target, and give both sides the same rest."],"d":"The plate-loaded machine lateral raise worked one arm at a time, so each side lifts its own load and the two can be trained to the same standard."},"preacher":{"n":"Machine Preacher Curl","img":"machine-preacher-curl","ph":["start","peak"],"k":"mc","inc":2.5,"st":2.5,"pl":null,"m1":["Biceps brachii"],"m2":["Brachialis"],"how":["Sit at a preacher curl machine and adjust the seat so your armpits sit at the top of the pad.","Place the upper arms flat on the pad and grip the handles.","Start with the arms extended — but not locked function phases(run){if(run.kind==='z2')return[{n:'Zone 2',d:run.target*60000,z:'easy'}];
 const p=[{n:'Warm-up',d:600000,z:'easy'}];for(let i=1;i<=run.rounds;i++){p.push({n:`Interval ${i} of ${run.rounds}`,d:240000,z:'hard',i});if(i<run.rounds)p.push({n:'Recovery',d:180000,z:'easy'})}

function chart(pts){if(pts.length<2)return'';const W=320,H=140,p=26,xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const yl=y0-(y1-y0||1)*.15,yh=y1+(y1-y0||1)*.15,X=x=>p+(x1===x0?.5:(x-x0)/(x1-x0))*(W-p-8),Y=y=>H-18-(y-yl)/(yh-yl)*(H-30);
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Progress chart"><line class="gl" x1="${p}" y1="${H-18}" x2="${W}" y2="${H-18}"/>
 <polyline class="ln" points="${pts.map(q=>`${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join(' ')}"/>${pts.map(q=>`<circle class="pt" cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3"/>`).join('')}
 <text x="2" y="${Y(y1)+4}">${fk(Math.round(y1))}</text><text x="2" y="${Y(y0)+4}">${fk(Math.round(y0))}</text><text x="${p}" y="${H-3}">${esc(fmtDate(x0,{day:'numeric',month:'short'}))}</text><text x="${W-8}" y="${H-3}" text-anchor="end">${esc(fmtDate(x1,{day:'numeric',month:'short'}))}</text></svg>`}

 const b=Math.max(0,...e.sets.filter(s=>s.k!=='W'&&s.kg>0).map(s=>e1(s.kg,s.reps)));return b?[L.start,Math.round(b*10)/10]:null}).filter(Boolean)}

function go(v){if(v==='workout'&&!S.active)v='today';if(v==='run'&&!S.run)v='cardio';cur=v;
 try{if(VIEWS[v])localStorage.setItem(VSTORE,v)}catch(e){}if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);render();scrollTo(0,0)}

/* ---------- dialogs & toast ---------- */
const dlg=$('#dlg'),dform=$('#dlgForm');let onSubmit=null,onCancel=null;
function openDlg(html,submit,cls){if(dlg.open){onCancel=null;dlg.close()}dlg.className=cls||'';dform.innerHTML=html;onSubmit=submit||null;dlg.showModal();dform.scrollTop=0;dlg.scrollTop=0}
function closeDlg(){const c=onCancel;onSubmit=null;onCancel=null;clearTimeout(demoT);if(dlg.open)dlg.close();return c}
dlg.addEventListener('close',()=>{if(dlg.open)return;clearTimeout(demoT);const c=onCancel;onSubmit=null;onCancel=null;c&&c();const v=$('#vid iframe');if(v)v.remove()});
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()});
function confirmBox(title,body,ok,danger){return new Promise(res=>{openDlg(`<h2>${esc(title)}</h2><p class="mute">${esc(body)}</p><div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn ${danger?'danger':'pri'}">${esc(ok)}</button></div>`,
 ()=>{onCancel=null;dlg.close();res(true)});onCancel=()=>res(false)})}
let toastT;
function toast(msg,label,fn){const t=$('#toast');if(!label)undoSnap=null;t.innerHTML=`<span>${esc(msg)}</span>${label?`<button type="button">${esc(label)}</button>`:''}`;
 if(label)t.querySelector('button').onclick=()=>{fn();t.classList.remove('show')};t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show');if(label)undoSnap=null},label?6500:3200)}

function logDetail(id){const l=S.logs.find(x=>x.id===id);if(!l)return;const vol=l.entries.reduce((a,e)=>a+e.sets.filter(s=>s.k!=='W').reduce((b,s)=>b+s.kg*s.reps,0),0);
 openDlg(`<h2>${SESS[l.day]} · ${esc(PROGRAM[l.day].name)}</h2><p class="mute" style="margin-bottom:10px">${esc(fmtDate(l.start))} · ${fmtTime(l.start)} · ${mmss(l.end-l.start)} · ${Math.round(vol).toLocaleString()} kg lifted</p>
 <div class="dl">${l.entries.map(e=>`<div><span>${esc(EXD[e.ex].n)}</span><span class="num" style="text-align:right">${e.sets.filter(s=>s.k!=='W').map(s=>noLoad(e.ex)?`${s.reps}`:`${fk(s.kg)}×${s.reps}`).join(', ')}</span></div>`).join('')}</div>
 <div class="row end"><button type="button" class="btn ghost danger" data-a="delLog" data-id="${l.id}">Delete</button><button type="button" class="btn pri" data-a="close">Close</button></div>`)}
function cardioDetail(id){const c=S.cardio.find(x=>x.id===id);if(!c)return;
 openDlg(`<h2>${c.type==='4x4'?'Norwegian 4×4':'Zone 2'}</h2><div class="dl"><div><span>Date</span><b>${esc(fmtDate(c.at))} · ${fmtTime(c.at)}</b></div><div><span>Duration</span><b>${c.mins} min</b></div>
 ${c.type==='4x4'?`<div><span>Intervals</span><b>${c.rounds}</b></div>`:''}<div><span>Activity</span><b>${esc(c.mode||'–')}</b></div><div><span>Avg heart rate</span><b>${c.hr?c.hr+' bpm':'–'}</b></div><div><span>Felt</span><b>${esc(c.rpe||'–')}</b></div></div>
 <div class="row end"><button type="button" class="btn ghost danger" data-a="delCardio" data-id="${c.id}">Delete</button><button type="button" class="btn pri" data-a="close">Close</button></div>`)}
function vo2Dlg(){openDlg(`<h2>Log a VO2 max test</h2>
 <div class="fld">Method<div class="seg"><label><input type="radio" name="m" value="cooper" checked><b>12-minute run</b></label><label><input type="radio" name="m" value="watch"><b>Watch estimate</b></label></div></div>
 <label class="fld" id="fDist">Distance in 12 minutes (metres)<input type="number" name="dist" inputmode="numeric" min="500" max="6000" placeholder="e.g. 2800"></label>
 <label class="fld" id="fVal" hidden>VO2 max from your watch<input type="number" name="val" inputmode="decimal" min="10" max="95" step="0.1" placeholder="e.g. 48"></label>
 <p class="small mute" id="vo2Prev">Run as far as you can in 12 minutes on a track or treadmill. VO2 max ≈ (metres − 505) ÷ 44.7.</p>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pri">Save</button></div>`,
 fd=>{const m=fd.get('m');let val,dist;if(m==='cooper'){dist=+fd.get('dist');if(!(dist>=500&&dist<=6000))return toast('Enter the distance in metres');val=(dist-504.9)/44.73}
  else{val=+fd.get('val');if(!(val>=10&&val<=95))return toast('Enter a value between 10 and 95')}
  S.vo2.push({id:uid(),at:now(),val:Math.round(val*10)/10,src:m,dist:dist||0,u:now()});save();closeDlg();render();toast(`VO2 max ${fk(Math.round(val*10)/10)} saved`)})}
function z2LogDlg(){openDlg(`<h2>Log Zone 2</h2><label class="fld">Minutes<input type="number" name="mins" inputmode="numeric" min="5" max="300" value="40"></label>
 <div class="fld">Activity<div class="seg">${['Incline walk','Bike','Easy jog','Rower'].map((n,i)=>`<label><input type="radio" name="mode" value="${n}" ${i===0?'checked':''}><b>${n}</b></label>`).join('')}</div></div>
 <label class="fld">Average heart rate (optional)<input type="number" name="hr" inputmode="numeric" min="40" max="230"></label>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pri">Save</button></div>`,
 fd=>{const mins=Math.round(+fd.get('mins'));if(!(mins>=5&&mins<=300))return toast('Enter the minutes');
  S.cardio.push({id:uid(),type:'z2',at:now(),mins,mode:fd.get('mode'),hr:Math.round(+fd.get('hr'))||0,rpe:'',u:now()});save();closeDlg();render();toast('Zone 2 logged')})}
function settingsDlg(){const s=S.set,days=[1,2,3,4,5,6,0];
 const canShare=!!(navigator.canShare&&window.File&&navigator.canShare({files:[new File(['{}'],'x.json',{type:'application/json'})]}));
 openDlg(`<h2>Settings</h2>
 <div class="fld">Weekly schedule<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">${days.map(d=>`<label class="small" style="display:grid;gap:4px">${WD[d]}<select name="sch${d}">${Object.entries(SESS).map(([k,n])=>`<option value="${k}" ${s.schedule[d]===k?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div></div>
 <div class="fld dsec">Heart rate<div class="row"><label class="small grow" style="display:grid;gap:4px">Max heart rate (bpm)<input type="number" name="hrMax" inputmode="numeric" min="120" max="230" value="${s.hrMax}"></label>
  <label class="small grow" style="display:grid;gap:4px">or estimate from age<input type="number" name="age" inputmode="numeric" min="12" max="90" placeholder="Age"></label></div>
  <p class="small mute" style="font-weight:400">Age estimate: 208 − 0.7 × age. A real max from a hard test or your watch is better.</p></div>
 <div class="fld dsec">Equipment<div class="row"><label class="small grow" style="display:grid;gap:4px">Barbell (kg)<input type="number" name="bar" inputmode="decimal" min="5" max="30" step="0.5" value="${s.bar}"></label>
  <label class="small grow" style="display:grid;gap:4px">Trap bar (kg)<input type="number" name="trap" inputmode="decimal" min="10" max="40" step="0.5" value="${s.trap}"></label></div></div>
 <div class="fld dsec">Timers<label class="tog"><input type="checkbox" name="sound" ${s.sound?'checked':''}>Sounds</label><label class="tog"><input type="checkbox" name="vib" ${s.vib?'checked':''}>Vibration</label><label class="tog"><input type="checkbox" name="awake" ${s.awake?'checked':''}>Keep the screen on during workouts and timers</label>
  ${'Notification' in window&&Notification.permission==='default'?'<button type="button" class="btn sm" data-a="notif">Allow notifications for timers</button>':''}</div>
 <div class="fld dsec">Training block<p class="small mute" style="font-weight:400">Week ${blockWeek()} since your last deload.${deloadOn()?` Deload runs until ${esc(fmtShort(s.deloadUntil))}.`:''}</p>
  <div class="row">${deloadOn()?'<button type="button" class="btn sm" data-a="deloadEnd">End deload now</button>':'<button type="button" class="btn sm" data-a="deloadStart">Start a deload week</button>'}<button type="button" class="btn sm ghost" data-a="blockReset">Restart week count</button></div></div>
 <div class="fld dsec">Theme<div class="seg">${['system','light','dark'].map(t=>`<label><input type="radio" name="theme" value="${t}" ${s.theme===t?'checked':''}><b>${t[0].toUpperCase()+t.slice(1)}</b></label>`).join('')}</div></div>
 <div class="fld dsec">Backup<p class="small mute" style="font-weight:400">Data is stored on this device. Export a backup now and then, or to move to another device (imports merge).</p>
  <div class="row"><button type="button" class="btn sm" data-a="export">Export backup</button>${canShare?'<button type="button" class="btn sm" data-a="shareBk">Share backup</button>':''}<label class="btn sm">Import and merge<input type="file" id="importF" accept=".json,application/json" hidden></label></div></div>
 <div class="fld dsec">Erase<button type="button" class="btn sm danger" data-a="wipe" style="justify-self:start">Erase all data</button></div>
 <p class="small mute dsec">Exercise illustrations and steps by <a href="https://repdb.co" rel="nofollow" target="_blank">RepDB (repdb.co)</a>. Technique videos belong to their creators. Not medical advice: stop if something hurts.</p>
 <div class="row end"><button class="btn pri">Save</button></div>`,
 fd=>{for(const d of days)S.set.schedule[d]=fd.get('sch'+d);const age=+fd.get('age');
  S.set.hrMax=age>=12&&age<=90?Math.round(208-0.7*age):clamp(Math.round(+fd.get('hrMax')||190),120,230);
  S.set.bar=clamp(+fd.get('bar')||20,5,30);S.set.trap=clamp(+fd.get('trap')||25,10,40);
  S.set.sound=!!fd.get('sound');S.set.vib=!!fd.get('vib');S.set.awake=!!fd.get('awake');S.set.theme=fd.get('theme')||'system';
  save();applyTheme();closeDlg();render();toast('Settings saved')},'wide')}
async function backupBlob(){return new Blob([JSON.stringify({...S,active:null,run:null,exportedAt:now(),app:'forge'})],{type:'application/json'})}
const backupName=()=>`forge-backup-${key()}.json`;

/* ---------- actions ---------- */
const A={
 go:b=>go(b.dataset.v),settings:()=>settingsDlg(),close:()=>{const c=closeDlg();c&&c()},
 start:b=>{if(S.active&&S.active.day!==b.dataset.d){toast('Finish or discard the workout in progress first');go('workout');return}startWorkout(b.dataset.d)},
 guide:b=>openGuide(b.dataset.ex),
 demoTap:()=>{const ims=$$('#dlg .demo img');if(ims.length<2)return;clearTimeout(demoT);const ph=+(ims[1].style.opacity==='1');demoLoop(ph?0:1)},
 playVid:b=>{const box=$('#vid');box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.v)}?autoplay=1&rel=0&playsinline=1" title="Technique video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`},
 tick:b=>tickSet(+b.dataset.i,+b.dataset.j),
 addSet:b=>{const it=S.active.items[+b.dataset.i],l=it.sets[it.sets.length-1];it.sets.push({...l,k:l.k==='T'?'B':l.k==='W'?'N':l.k,kg:'',reps:'',done:false,prev:''});save();renderWorkout()},
 delSet:b=>{const it=S.active.items[+b.dataset.i];if(it.sets.length>1&&!it.sets[it.sets.length-1].done){it.sets.pop();save();renderWorkout()}},
 swap:b=>swapDlg(+b.dataset.i),
 pickSwap:b=>pickSwap(+b.dataset.i,b.dataset.ex),
 doSwap:b=>{const i=+b.dataset.i,ex=b.dataset.ex,A0=S.active,it=A0.items[i],k=`${A0.day}:${it.slot}`;
  if(b.dataset.mode==='always'){if(ex===it.orig)delete S.swaps[k];else S.swaps[k]=ex;A0.items[i]=buildItem(A0.day,it.slot);toast(`${EXD[ex].n} is now your default`)}
  else{A0.items[i]=buildItem(A0.day,it.slot,ex);toast(`Swapped to ${EXD[ex].n} for today`)}
  save();closeDlg();renderWorkout()},
 progSwap:b=>progSwapDlg(b.dataset.d,+b.dataset.i),
 setDefault:b=>{const d=b.dataset.d,i=+b.dataset.i,ex=b.dataset.ex,k=`${d}:${i}`;snap();if(ex===PROGRAM[d].items[i].ex)delete S.swaps[k];else S.swaps[k]=ex;
  save();closeDlg();render();toast(`${SESS[d]} now uses ${EXD[ex].n}`,'Undo',undo)},
 'rest-15':()=>{const r=S.active.rest;if(r&&r.mode==='rest'){r.end-=15000;save();renderRest()}},
 'rest+15':()=>{const r=S.active.rest;if(r&&r.mode==='rest'){r.end=Math.max(r.end,now())+15000;r.total+=15000;r.alerted=false;save();renderRest()}},
 restSkip:()=>{if(S.active){S.active.rest=null;save();renderRest()}},
 wFinish:async()=>{const A0=S.active,left=A0.items.reduce((a,it)=>a+it.sets.filter(s=>!s.done&&s.k!=='W').length,0),any=A0.items.some(it=>it.sets.some(s=>s.done));
  if(!any){if(await confirmBox('Nothing ticked yet','No sets are ticked, so there is nothing to save. Discard this workout?','Discard',true)){S.active=null;saveNow();wake(false);go('today')}return}
  if(left&&!await confirmBox('Finish workout?',`${plural(left,'set')} ${left===1?"isn't":"aren't"} ticked and won't be saved.`,'Finish',false))return;finishWorkout()},
 wDiscard:async()=>{if(!await confirmBox('Discard this workout?','Nothing from this session will be saved.','Discard',true))return;S.active=null;saveNow();wake(false);go('today')},
 histLift:b=>{histLift=b.dataset.ex;render()},
 logDetail:b=>logDetail(b.dataset.id),cardioDetail:b=>cardioDetail(b.dataset.id),
 vo2Detail:b=>{const v=S.vo2.find(x=>x.id===b.dataset.id);if(!v)return;openDlg(`<h2>VO2 max ${fk(v.val)}</h2><p class="mute">${esc(fmtDate(v.at))} · ${v.src==='cooper'?`12-minute run, ${v.dist} m`:'watch estimate'}</p><div class="row end"><button type="button" class="btn ghost danger" data-a="delVo2" data-id="${v.id}">Delete</button><button type="button" class="btn pri" data-a="close">Close</button></div>`)},
 delLog:b=>{snap();S.logs=S.logs.filter(x=>x.id!==b.dataset.id);S.deleted[b.dataset.id]=now();save();closeDlg();render();toast('Workout deleted','Undo',undo)},
 delCardio:b=>{snap();S.cardio=S.cardio.filter(x=>x.id!==b.dataset.id);S.deleted[b.dataset.id]=now();save();closeDlg();render();toast('Session deleted','Undo',undo)},
 delVo2:b=>{snap();S.vo2=S.vo2.filter(x=>x.id!==b.dataset.id);S.deleted[b.dataset.id]=now();save();closeDlg();render();toast('Test deleted','Undo',undo)},
 start4x4:()=>{const mode=($('input[name=mode]:checked')||{}).value||'bike',rounds=+(($('input[name=rounds]:checked')||{}).value||4);startRun('4x4',{mode,rounds})},
 startZ2:()=>{const target=+(($('input[name=target]:checked')||{}).value||40),mode=($('input[name=z2mode]:checked')||{}).value||'walk';startRun('z2',{target,mode})},
 logZ2:()=>z2LogDlg(),vo2:()=>vo2Dlg(),
 runToggle:()=>runToggle(),runSkip:()=>runSkip(),
 runEnd:async()=>{const is4=S.run.kind==='4x4';if(is4&&!await confirmBox('End the session early?','You can still save what you did.','End session',false))return;runFinish()},
 runSave:()=>{const r=S.run,hr=Math.round(+($('#cHr')||{}).value)||0,rpe=($('input[name=rpe]:checked')||{}).value||'';
  const modes={bike:'Bike',row:'Rower',air:'Air bike',run:'Run',walk:'Incline walk',jog:'Easy jog'};
  S.cardio.push({id:uid(),type:r.kind,at:r.start,mins:r.fmins,rounds:r.frounds||0,mode:modes[r.mode]||r.mode,hr:hr>=40&&hr<=230?hr:0,rpe,u:now()});S.run=null;saveNow();go('cardio');toast('Session saved')},
 runDiscard:async()=>{if(!await confirmBox('Discard this session?','It won’t be saved.','Discard',true))return;S.run=null;saveNow();wake(false);go('cardio')},
 deloadStart:()=>{S.set.deloadUntil=now()+7*DAY;save();closeDlg();render();toast('Deload week started: half the sets, same weights')},
 deloadEnd:()=>{S.set.deloadUntil=0;S.set.blockStart=now();save();closeDlg();render();toast('Deload ended. New training block started.')},
 blockReset:()=>{S.set.blockStart=now();save();closeDlg();render();toast('Week count restarted')},
 notif:async()=>{try{await Notification.requestPermission()}catch(e){}S.set.askedNotif=true;save();closeDlg();settingsDlg()},
 export:async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await backupBlob());a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved to your downloads')},
 shareBk:async()=>{try{await navigator.share({files:[new File([await backupBlob()],backupName(),{type:'application/json'})],title:'Forge backup'})}catch(e){}},
 wipe:async()=>{closeDlg();if(!await confirmBox('Erase everything?','All workouts, cardio sessions and tests on this device will be deleted. Export a backup first if you might want them.','Erase all',true))return;
  snap();const set=S.set;S=blank();S.set={...set,blockStart:now(),deloadUntil:0};saveNow();wake(false);go('today');toast('All data erased','Undo',undo)},
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='dlgForm'&&onSubmit)onSubmit(new FormData(e.target),e.target)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&S.active&&cur==='workout'){const s=S.active.items[+t.dataset.i]?.sets[+t.dataset.j];if(s){s[t.dataset.f]=t.value.replace(',','.').trim();save()}}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.f&&cur==='workout'){e.preventDefault();if(t.dataset.f==='kg')focusCell(+t.dataset.i,+t.dataset.j,'reps');else{const s=S.active.items[+t.dataset.i].sets[+t.dataset.j];if(!s.done)tickSet(+t.dataset.i,+t.dataset.j)}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.name==='theme'&&t.closest('#dlg')){S.set.theme=t.value;save();applyTheme()}
 else if(t.name==='m'&&t.closest('#dlg')){$('#fDist').hidden=t.value!=='cooper';$('#fVal').hidden=t.value==='cooper'}
 else if(t.id==='importF'&&t.files[0]){t.files[0].text().then(txt=>{const d=JSON.parse(txt);if(!d||!d.v||!Array.isArray(d.logs))throw 0;snap();S=merge(S,normalize(d));saveNow();closeDlg();render();toast('Backup merged','Undo',undo)}).catch(()=>toast('That file is not a Forge backup'))}});
document.addEventListener('pointerdown',unlockAudio,{once:true});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if((VIEWS[v]||v==='workout'||v==='run')&&v!==cur)go(v)});
addEventListener('pagehide',saveNow);

/* ---------- tick ---------- */
function tick(){
 if(S.active){const c=$('#wClock');if(c)c.textContent=mmss(now()-S.active.start);const r=S.active.rest;
  if(r&&r.mode==='rest'){const left=r.end-now();if(left<=0&&!r.alerted){r.alerted=true;save();chime();buzz([250,120,250]);notify('Rest over. Time for your next set.');renderRest()}
   else if(left<=-6000){S.active.rest=null;save();renderRest()}else if(left>0){const t=$('#restT');if(t)t.textContent=mmss(left);const p=$('#restbar .prog');if(p)p.style.width=clamp(100-left/r.total*100,0,100)+'%'}}}
 if(S.run&&!S.run.finished){tickRun(false);updRun()}
 if(S.set.deloadUntil&&now()>S.set.deloadUntil){S.set.blockStart=S.set.deloadUntil;S.set.deloadUntil=0;save()}}
setInterval(tick,500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();else{tick();if(S.active||(S.run&&!S.run.finished&&!S.run.pausedAt))wake(true)}});

function applyTheme(){const r=document.documentElement;if(S.set.theme==='light'||S.set.theme==='dark')r.dataset.theme=S.set.theme;else r.removeAttribute('data-theme');
 requestAnimationFrame(()=>{const m=$('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor})}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* ---------- boot ---------- */
$('#nav').innerHTML=`<div class="brand"><img src="icon-192.png" alt="Forge"></div>`+Object.keys(VIEWS).map(v=>`<button data-a="go" data-v="${v}"><span class="ic">${I[v]}</span>${VIEWS[v]}</button>`).join('');
$('#gear').innerHTML=I.gear;
if(S.active&&S.active.rest&&S.active.rest.mode==='rest'&&S.active.rest.end<now())S.active.rest=null;
if(S.run&&!S.run.finished)tickRun(true);
applyTheme();go(cur);
if(S.active||(S.run&&!S.run.finished&&!S.run.pausedAt))wake(true);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
